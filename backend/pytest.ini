[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -v
    --cov=app
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-fail-under=85
markers =
    unit: Unit tests with all external dependencies mocked
    integration: Integration tests using real in-process components
    slow: Tests that take more than 2 seconds
filterwarnings =
    ignore::DeprecationWarning
